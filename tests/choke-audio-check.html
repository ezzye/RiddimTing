<!doctype html><html lang="en"><meta charset="utf-8"><title>Choke audio regression</title><body><h1>Choke audio regression</h1><p>Run in a browser with Web Audio. This generates test tones locally.</p><button id="run">Run audio checks</button><pre id="result"></pre><script src="../app/engine.js"></script><script>
async function render(kind){
 const c=new OfflineAudioContext(2,44100,44100),e=new RiddimAudio();e._setup(c);for(let g=0;g<4;g++)e.setGroup(g,{volume:1,send:0});
 const b=c.createBuffer(1,44100,44100),v=b.getChannelData(0);for(let i=0;i<v.length;i++)v[i]=.25*Math.sin(2*Math.PI*440*i/44100);e.setSample('tone',b);
 const pad={sound:'sample:tone',mode:kind==='loop'?'loop':'oneshot',muteGroup:1,attack:.005,volume:.7,cutoff:14000,start:0,end:1};
 if(kind==='key-tail'||kind==='key-baseline'){const voice=e.trigger({...pad,mode:'key',release:.8},.1,.8,0,0);voice.stop(.2);if(kind==='key-tail')e.trigger({...pad,mode:'oneshot'},.3,0,0,0)}
 else if(kind==='future'){e.trigger(pad,.4,.8,0,0);e.trigger({...pad,mode:'oneshot'},.2,0,0,0)}
 else {e.trigger(pad,.1,.8,0,0);if(kind!=='baseline')e.trigger({...pad,mode:'oneshot',muteGroup:kind==='off'?0:1,sound:kind==='missing'?'sample:missing':'sample:tone'},.3,0,0,kind==='other'?1:0)}
 const audio=await c.startRendering(),a=audio.getChannelData(0),rms=(start,end)=>{let x=0;for(let i=start*44100|0;i<end*44100;i++)x+=a[i]*a[i];return Math.sqrt(x/((end-start)*44100))};return rms(.45,.55);
}
document.getElementById('run').onclick=async()=>{const out=document.getElementById('result');try{const values={};for(const k of ['baseline','choke','off','other','missing','loop','future','key-tail','key-baseline'])values[k]=await render(k);const b=values.baseline;if(!(b>.001&&values.choke<b*.1&&values.off>b*.8&&values.other>b*.8&&values.missing>b*.8&&values.loop>b*.8&&values.future>b*.8&&values['key-baseline']>.001&&values['key-tail']<values['key-baseline']*.1))throw Error('Unexpected rendered audio');out.textContent='PASS\n'+JSON.stringify(values,null,2)}catch(e){out.textContent='FAIL: '+e.stack}};
</script></body></html>
